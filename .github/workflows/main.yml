

name: CI

on: [push, workflow_dispatch]

jobs:
  sast_scan:
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Scan
        run: bandit -ll -ii -r . -f json -o bandit-report.json

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-findings
          path: bandit-report.json

  image_scan:
    name: Build and Run Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -f Dockerfile -t mytestapp:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker Scout Scan
        uses: docker/scout-action@v1.15.1
        with:
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}
          command: quickview,cves
          image: local://mytestapp:latest
          only-severities: critical,high
          sarif-file: scout-report.sarif
          exit-code: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-scout-findings
          path: scout-report.sarif

  dast_scan:
    name: Run OWASP ZAP Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build PyGoat
        run: docker build -t pygoat-lab:latest .

      - name: Deploy PyGoat
        run: |
          docker run -d --name pygoat \
            -p 8000:8000 pygoat-lab:latest

      - name: Initialize database
        run: |
          docker exec pygoat python manage.py migrate --noinput
          
      - name: Initialize database
        run: |
          docker exec pygoat python manage.py migrate --noinput

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsSL http://127.0.0.1:8000/login/ > /dev/null; then
              echo "PyGoat is ready"
              exit 0
            fi
            sleep 5
          done
          docker logs pygoat
          exit 1

      - name: Prepare report directory
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports

      - name: Verify CSP Header
        run: |
          set -o pipefail
          for path in / /login/ /register; do
            echo "Checking endpoint: $path"
            curl -fsS -D - -o /dev/null \
              "http://127.0.0.1:8000$path" \
              | grep -i "^Content-Security-Policy:"
          done

      - name: Run ZAP Baseline Scan
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000 \
            -r zap-report.html \
            -J zap-report.json

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-findings
          path: zap-reports/

      - name: Stop PyGoat
        if: always()
        run: docker rm -f pygoat || true

      - name: Check application status
        run: |
          curl -sSL -o /dev/null \
            -w "Login HTTP status: %{http_code}\n" \
            http://127.0.0.1:8000/login/
          docker logs --tail 50 pygoat
